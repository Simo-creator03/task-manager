# ============================================================
# CONFIGURATION APP ENGINE — backend Spring Boot
#
# Déploiement par GitHub Actions :
#   gcloud app deploy --appyaml=<fichier généré>
#
# Les valeurs des variables d'environnement sont remplacées au
# moment du déploiement :
#   - DB_USER, DB_NAME, CLOUDSQL_INSTANCE : variables GitHub
#   - DB_PASSWORD : secret Secret Manager "db-password"
#
# Pour un déploiement manuel : copiez ce fichier, remplacez les
# valeurs (sans jamais committer le mot de passe), puis lancez :
#   gcloud app deploy --appyaml=<copie> --project=<projet>
# ============================================================

runtime: java17

# F2 = 512 Mo : Spring Boot + HikariCP ne tiennent pas dans F1 (256 Mo).
instance_class: F2

# Aucune instance quand l'application est inactive (coût maîtrisé).
automatic_scaling:
  min_instances: 0
  max_instances: 2
  target_cpu_utilization: 0.65

env_variables:
  SPRING_PROFILES_ACTIVE: 'prod'
  SPRING_DATASOURCE_USERNAME: "__DB_USER__"
  SPRING_DATASOURCE_PASSWORD: __DB_PASSWORD__
  # Connexion Cloud SQL via socket Unix (sécurisé, sans IP publique).
  SPRING_DATASOURCE_URL: "jdbc:mysql:///__DB_NAME__?cloudSqlInstance=__CLOUDSQL_INSTANCE__&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false&serverTimezone=UTC"
