spring:
  datasource:
    url: jdbc:h2:mem:task_manager;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: password
  jpa:
    generate-ddl: true
    show-sql: false
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    database: h2
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
server:
  port: 8090
