# Configuration nginx du conteneur frontend.
# (Copiée dans /etc/nginx/conf.d/default.conf par le Dockerfile.)

server {
    # Port du conteneur (utilisé par docker-compose pour les tests locaux).
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression des fichiers texte.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Application React (SPA) : toute URL inconnue renvoie index.html
    # pour que React Router prenne le relais (/login, /tasks, ...).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers produits par Vite sont versionnés : cache longue durée.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
