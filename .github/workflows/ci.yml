name: CI Task Manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '22'

jobs:

  backend:
    name: Backend — build et tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compiler et lancer les tests
        working-directory: task_manager_backend
        run: mvn -B -ntp verify

  frontend:
    name: Frontend — lint et build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: task_manager_frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: task_manager_frontend
        run: npm ci

      - name: Analyse ESLint
        working-directory: task_manager_frontend
        run: npm run lint

      - name: Build de vérification
        working-directory: task_manager_frontend
        env:
          VITE_API_URL: http://localhost:8081
        run: npm run build
