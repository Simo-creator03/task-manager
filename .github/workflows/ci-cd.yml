# ============================================================
# PIPELINE CI/CD — Task Manager (monorepo)
#
# Déroulé :
#   1. backend  : compilation + tests (Maven, base H2 en mémoire)
#   2. frontend : lint + build de vérification (Vite)
#   3. images   : construction des images Docker + push vers
#                 Artifact Registry   (uniquement sur la branche main)
#   4. déploiement : Cloud Build met à jour les deux services
#                    Cloud Run avec les nouvelles images (cloudbuild.yaml)
#
# Les étapes 3 et 4 ne s'exécutent que sur un push vers "main",
# pas sur les pull requests.
# ============================================================

name: CI/CD Task Manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Valeurs communes à tous les jobs (adaptables ici).
env:
  REGION: europe-west1
  ARTIFACT_REPOSITORY: task-manager
  BACKEND_SERVICE: task-manager-backend
  FRONTEND_SERVICE: task-manager-frontend
  JAVA_VERSION: '17'
  NODE_VERSION: '22'

jobs:

  # ----------------------------------------------------------
  # 1) BACKEND : compilation + tests
  #    Les tests utilisent H2 (src/test/resources/application.yml),
  #    donc aucune base MySQL n'est nécessaire dans la CI.
  # ----------------------------------------------------------
  backend:
    name: Backend — build et tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compiler et lancer les tests
        working-directory: task_manager_backend
        run: mvn -B -ntp verify

  # ----------------------------------------------------------
  # 2) FRONTEND : lint + build de vérification
  # ----------------------------------------------------------
  frontend:
    name: Frontend — lint et build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: task_manager_frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: task_manager_frontend
        run: npm ci

      - name: Analyse ESLint
        working-directory: task_manager_frontend
        run: npm run lint

      - name: Build de vérification
        working-directory: task_manager_frontend
        env:
          # Utilisée uniquement pour que Vite puisse compiler.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:8081' }}
        run: npm run build

  # ----------------------------------------------------------
  # 3) IMAGES DOCKER + 4) DÉPLOIEMENT (branche main uniquement)
  #    - authentification GCP via le secret GCP_SA_KEY
  #    - build et push des images vers Artifact Registry
  #    - appel de Cloud Build pour déployer sur Cloud Run
  # ----------------------------------------------------------
  deploy:
    name: Docker + déploiement Cloud Run
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Authentification auprès de Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Installer gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Autoriser Docker à pousser vers Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Construire et pousser l'image backend
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.BACKEND_SERVICE }}
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./task_manager_backend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Construire et pousser l'image frontend
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.FRONTEND_SERVICE }}
          # ATTENTION : l'URL du backend est figée dans le bundle au moment du build.
          API_URL: ${{ vars.VITE_API_URL }}
        run: |
          docker build \
            --build-arg "VITE_API_URL=$API_URL" \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            ./task_manager_frontend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Déployer sur Cloud Run (via Cloud Build)
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CLOUDSQL_INSTANCE: ${{ vars.CLOUDSQL_INSTANCE }}
          DB_NAME: ${{ vars.DB_NAME || 'task_manager' }}
          DB_USER: ${{ vars.DB_USER || 'task_manager' }}
          BACKEND_IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }}
          FRONTEND_IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.FRONTEND_SERVICE }}:${{ github.sha }}
        run: |
          gcloud builds submit \
            --project="$PROJECT_ID" \
            --config cloudbuild.yaml \
            --substitutions="_BACKEND_IMAGE=$BACKEND_IMAGE,_FRONTEND_IMAGE=$FRONTEND_IMAGE,_REGION=$REGION,_CLOUDSQL_INSTANCE=$CLOUDSQL_INSTANCE,_DB_NAME=$DB_NAME,_DB_USER=$DB_USER" \
            .
