# ============================================================
# PIPELINE CI/CD — Task Manager (monorepo)
#
# Déroulé :
#   1. backend  : compilation + tests (Maven, base H2 en mémoire)
#   2. frontend : lint + build de vérification (Vite)
#   3. déploiement (uniquement sur la branche main) :
#        - frontend : Firebase Hosting (gratuit)
#        - backend  : job App Engine désactivé (facturation GCP requise)
#
# Le backend tourne en local et est exposé par un tunnel ; son URL
# est fournie au build du frontend via la variable VITE_API_URL.
# ============================================================

name: CI/CD Task Manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Valeurs communes à tous les jobs.
env:
  JAVA_VERSION: '17'
  NODE_VERSION: '22'

jobs:

  # ----------------------------------------------------------
  # 1) BACKEND : compilation + tests
  #    Les tests utilisent H2 (src/test/resources/application.yml),
  #    donc aucune base MySQL n'est nécessaire dans la CI.
  # ----------------------------------------------------------
  backend:
    name: Backend — build et tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compiler et lancer les tests
        working-directory: task_manager_backend
        run: mvn -B -ntp verify

  # ----------------------------------------------------------
  # 2) FRONTEND : lint + build de vérification
  # ----------------------------------------------------------
  frontend:
    name: Frontend — lint et build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: task_manager_frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: task_manager_frontend
        run: npm ci

      - name: Analyse ESLint
        working-directory: task_manager_frontend
        run: npm run lint

      - name: Build de vérification
        working-directory: task_manager_frontend
        env:
          # Utilisée uniquement pour que Vite puisse compiler.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:8081' }}
        run: npm run build

  # ----------------------------------------------------------
  # 3) BACKEND -> APP ENGINE (DÉSACTIVÉ)
  #    App Engine et Cloud SQL exigent un compte de facturation
  #    GCP. En attendant, le backend tourne en local et est exposé
  #    par un tunnel (voir README). Pour réactiver : remplacez
  #    "if: false" par la condition d'origine, activez la
  #    facturation et recréez les ressources (docs/etape2...).
  # ----------------------------------------------------------
  deploy-backend:
    name: Déploiement backend — App Engine (désactivé)
    needs: backend
    if: false
    runs-on: ubuntu-latest
    outputs:
      backend_url: ${{ steps.url.outputs.backend_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Authentification auprès de Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Installer gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Générer la configuration App Engine
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CLOUDSQL_INSTANCE: ${{ vars.CLOUDSQL_INSTANCE }}
          DB_NAME: ${{ vars.DB_NAME || 'task_manager' }}
          DB_USER: ${{ vars.DB_USER || 'task_manager' }}
        run: |
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=db-password --project="$PROJECT_ID")"
          export DB_PASSWORD
          python3 - <<'PY'
          import json
          import os
          import pathlib

          config = pathlib.Path("task_manager_backend/app.yaml").read_text(encoding="utf-8")
          for token, variable in {
              "__CLOUDSQL_INSTANCE__": "CLOUDSQL_INSTANCE",
              "__DB_NAME__": "DB_NAME",
              "__DB_USER__": "DB_USER",
          }.items():
              config = config.replace(token, os.environ[variable])
          config = config.replace("__DB_PASSWORD__", json.dumps(os.environ["DB_PASSWORD"]))
          pathlib.Path("/tmp/app-engine.yaml").write_text(config, encoding="utf-8")
          PY

      - name: Déployer sur App Engine
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        working-directory: task_manager_backend
        run: gcloud app deploy --project="$PROJECT_ID" --appyaml=/tmp/app-engine.yaml --quiet

      - name: Récupérer l'URL publique du backend
        id: url
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          HOSTNAME="$(gcloud app describe --project="$PROJECT_ID" --format='value(defaultHostname)')"
          echo "backend_url=https://$HOSTNAME" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------
  # 4) FRONTEND -> FIREBASE HOSTING (branche main uniquement)
  #    Firebase Hosting est gratuit (offre Spark), aucune
  #    facturation nécessaire. VITE_API_URL doit pointer vers
  #    le backend exposé par le tunnel (voir README).
  # ----------------------------------------------------------
  deploy-frontend:
    name: Déploiement frontend — Firebase Hosting
    needs: frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: task_manager_frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: task_manager_frontend
        run: npm ci

      - name: Build du frontend
        working-directory: task_manager_frontend
        env:
          # URL du backend exposée par le tunnel (Vite fige VITE_*).
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:8081' }}
        run: npm run build

      - name: Authentification auprès de Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Déployer sur Firebase Hosting
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          npm install --global firebase-tools
          firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive
